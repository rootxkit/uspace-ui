<div lang="en" class="bg-background p-4 text-foreground">
<div class="grid gap-2" data-testid="bars">
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">connecting, first time</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="connecting">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-age-aging">
</span>Connecting</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">no frame received yet</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="0">0 frames dropped</span>
</span>
</div>
</figure>
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">live</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="live">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-age-live">
</span>Live</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">last frame 1 s ago</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="0">0 frames dropped</span>
</span>
</div>
</figure>
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">live and quiet for ten minutes</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="live">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-age-live">
</span>Live</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">last frame 10 min ago</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="0">0 frames dropped</span>
</span>
</div>
</figure>
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">live, frames dropped and ignored, degraded</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="live">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-age-live">
</span>Live</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">last frame 1 s ago</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="17">17 frames dropped</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="malformed">2 malformed frames ignored</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="degraded">Degraded: Manned traffic unavailable; DSS unavailable</span>
</span>
</div>
</figure>
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">down, retrying</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="down">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-severity-critical">
</span>Feed down, retrying</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">last frame 1 min ago</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="0">0 frames dropped</span>
</span>
</div>
</figure>
<figure class="m-0 grid gap-1">
<figcaption class="font-mono text-xs text-muted-foreground">session ended (4401), retrying</figcaption>
<div role="status" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md border border-border bg-card px-3 py-1.5 text-sm text-card-foreground" data-connection="down">
<span data-part="connection" class="inline-flex items-center gap-2 font-semibold">
<span aria-hidden="true" class="inline-block size-2.5 rounded-full bg-severity-critical">
</span>Feed down, retrying</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="last-frame">last frame 20 s ago</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="dropped" data-dropped="0">0 frames dropped</span>
</span>
<span class="inline-flex items-center gap-3">
<span aria-hidden="true" class="text-muted-foreground">·</span>
<span data-part="session">Session ended: sign in again</span>
</span>
</div>
</figure>
</div>
</div>

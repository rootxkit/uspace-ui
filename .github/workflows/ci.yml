# CI of @rootxkit/uspace-ui (docs/PLAN.md §10 jobs 1-8). Branch protection
# is the owner's. On a tag, release.yml calls this workflow (workflow_call)
# so the release runs the same jobs, and releases the tarball the `pack`
# job built and tested (WP-13a).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/api/**"
      - "docs/CORE_VERSION"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/api/**"
      - "docs/CORE_VERSION"
  workflow_call:
    outputs:
      tarball-name:
        description: File name of the packed tarball (the `package` artifact)
        value: ${{ jobs.pack.outputs.name }}
      tarball-sha256:
        description: SHA-256 of the packed tarball
        value: ${{ jobs.pack.outputs.sha256 }}

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release
  # never shares (or cancels) the group of a push or pull request run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token for every job. Every `uses:` is pinned to a full commit
# SHA (version in the trailing comment; .github/dependabot.yml moves them)
# and every checkout drops its credential (persist-credentials: false), so
# no third-party step finds a token in .git/config (retro-audit B1).
permissions:
  contents: read

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail. The runner's default,
    # bash -e without pipefail, lets a failing command on the left of a
    # pipe (tar -tzf | wc -l in the pack job) pass the step.
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prettier, build, eslint (the kit's own config), tsc, publint, attw,
      # api-extractor (fails on a stale report), size budgets, hostname grep
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total; console.log("| metric | % |\n|---|---|\n" + ["statements","branches","functions","lines"].map(k => `| ${k} | ${t[k].pct} |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary was written." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # components in Chromium, axe after every test, golden snapshots
      - run: pnpm test:browser

  pack:
    # The release path without releasing (WP-13a): the tarball a tag would
    # attach, checked for exactly `files`, linted as packed, installed by URL
    # into a scratch consumer. release.yml downloads this job's artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.pack.outputs.name }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: pnpm pack, and check the tarball holds exactly `files`
        id: pack
        run: node scripts/pack-test.mjs --out "$RUNNER_TEMP/pack"
      - name: publint and attw on the packed tarball
        run: |
          pnpm exec publint run --strict "${{ steps.pack.outputs.tarball }}"
          pnpm exec attw "${{ steps.pack.outputs.tarball }}" --profile esm-only --format table-flipped --exclude-entrypoints ./styles/tokens.css ./styles/map.css ./fonts/fonts.css ./package.json
      - name: Install by URL into a scratch consumer
        run: node scripts/consumer-test.mjs "${{ steps.pack.outputs.tarball }}"
      - name: What a tag would release
        run: |
          files=$(tar -tzf "${{ steps.pack.outputs.tarball }}" | wc -l)
          kind=release
          if [ "$(node scripts/release.mjs prerelease)" = true ]; then kind=pre-release; fi
          {
            echo "Would release ${{ steps.pack.outputs.name }} ($files files) as a GitHub $kind on tag v$(node -p 'require("./package.json").version')"
            echo ""
            echo "- sha256: \`${{ steps.pack.outputs.sha256 }}\`"
            echo "- consumer dependency: \`\"@rootxkit/uspace-ui\": \"$(node scripts/release.mjs url)\"\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7
          if-no-files-found: error

  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WP-2 adds the fonts and their glyph coverage and size tests. Until
      # then this job says so in its summary instead of passing over nothing
      # in silence.
      - name: Fonts present?
        id: present
        run: |
          if ls fonts/*.woff2 >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED: no fonts/*.woff2 yet (WP-2); no glyph or size check ran." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=fonts skipped::no fonts/*.woff2 yet (WP-2)"
          fi
      - if: steps.present.outputs.present == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.present.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.present.outputs.present == 'true'
        run: pnpm exec vitest run --project node src/fonts

  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WP-13 adds examples/next-app (next build, its lint, the generated
      # types diff). Until then this job says so in its summary.
      - name: Example present?
        run: |
          if [ -f examples/next-app/package.json ]; then
            echo "examples/next-app exists but this job has no steps for it yet; WP-13 writes them." >&2
            exit 1
          fi
          echo "SKIPPED: no examples/next-app yet (WP-13); nothing was built." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=example skipped::no examples/next-app yet (WP-13)"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git --redact --verbose .

  enums:
    # Required on main, best-effort on pull requests (PLAN §10 job 7).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/check-enums.sh

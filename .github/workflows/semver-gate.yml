# The semver gate (docs/PLAN.md §12, WP-14): on every pull request, what it
# changes in the API report, the semantic tokens and the symbology, and
# whether it carries the label and CHANGELOG heading or line that needs
# (scripts/semver-gate.mjs prints each rule and why). Its own workflow,
# without a path filter, so a required check always reports, and re-run on
# a label change without re-running the rest of CI.
name: semver-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: semver-gate-${{ github.ref }}
  cancel-in-progress: true

# Read-only; every `uses:` pinned to a full commit SHA (retro-audit B1).
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  semver-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit must be in the clone for `git show base:path`.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The gate reads the symbology with the TypeScript parser.
      - run: pnpm install --frozen-lockfile
      # The labels and the base reach the script through env, never through
      # an expression interpolated into the shell (retro-audit N5).
      - name: semver gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          node scripts/semver-gate.mjs --base "$BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
